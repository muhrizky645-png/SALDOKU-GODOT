name: Deploy Web Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan editor config + export templates
        run: |
          mkdir -p ~/.config/
          cp -r /root/.config/godot ~/.config/godot 2>/dev/null || true
          mkdir -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true

      - name: Import project
        run: godot --headless --import || true

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          echo "--- Hasil web build ---"
          ls -la build/web/ || true

      - name: Upload artifact web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  deploy:
    name: Deploy ke gh-pages
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact web
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Publish ke branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
