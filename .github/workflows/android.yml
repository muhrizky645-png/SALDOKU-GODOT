name: Build Android APK

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: SALDOKU

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan editor config + export templates
        run: |
          mkdir -p ~/.config/
          cp -r /root/.config/godot ~/.config/godot 2>/dev/null || true
          mkdir -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true

      - name: Buat debug keystore & atur signing
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$PWD/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$PWD/debug.keystore\"|" export_presets.cfg
          sed -i "s|keystore/debug_user=\"\"|keystore/debug_user=\"androiddebugkey\"|" export_presets.cfg
          sed -i "s|keystore/debug_password=\"\"|keystore/debug_password=\"android\"|" export_presets.cfg

      - name: Import project
        run: godot --headless --import || true

      - name: Build Android debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/${EXPORT_NAME}.apk
          ls -la build/android/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SALDOKU-Android-APK
          path: build/android/*.apk
          if-no-files-found: error
